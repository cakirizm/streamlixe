# StreamLiveX — native iOS derleme + TestFlight (Mac gerektirmez)
# Codemagic bu dosyayi deponun kokunde bekler. Proje XcodeGen ile uretildiginden
# derlemeden once `xcodegen generate` calisir.
#
# IMZA: Dagitim sertifikasi, Codemagic'te "signing" grubunda tanimli
# CERTIFICATE_PRIVATE_KEY guvenli degiskeniyle olusturulur/yeniden kullanilir.
# Boylece her build ayni sertifikayi kullanir (Apple'in sertifika limitine takilmaz).
workflows:
  ios-testflight:
    name: StreamLiveX iOS -> TestFlight
    instance_type: mac_mini_m2   # Codemagic ucretsiz katman (500 dk/ay)
    max_build_duration: 60
    integrations:
      # Codemagic > Settings > Integrations > Developer Portal altindaki
      # API anahtarinin ADIYLA BIREBIR AYNI olmali.
      app_store_connect: "StreamLiveX ASC"
    environment:
      groups:
        - signing              # CERTIFICATE_PRIVATE_KEY (secure) bu gruptan gelir
      vars:
        BUNDLE_ID: "com.streamlivex.ios"
        XCODE_SCHEME: "StreamLiveX"
      xcode: latest              # Xcode 26 / iOS 26 SDK (Apple 2026 zorunlulugu)
      cocoapods: default
    scripts:
      - name: Branch iOS arayuzunu IPA icin paketle
        script: |
          # Tum is 2026-09'da main'e merge edildi ve diger dallar silindi. Guard duruyor ki
          # ileride acilacak bir ozellik dalindan yanlislikla TestFlight'a IPA gitmesin.
          if [ "$CM_BRANCH" != "main" ]; then
            echo "Bu workflow yalnizca main dali icindir (calisan dal: $CM_BRANCH)."
            exit 1
          fi
          npm ci
          VITE_UI_BUILD_SHA="$(git rev-parse --short HEAD)" npm run build:ios-web
      - name: XcodeGen ile Xcode projesini uret
        script: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: iOS oynatici bagimliliklarini kur
        script: |
          cd ios
          pod install
      - name: Sertifika + provisioning profile (yoksa olustur, varsa kullan)
        script: |
          set -euo pipefail
          # Bu adim sessizce hicbir sey yapmadan yesil donebiliyor; o zaman hata 5 adim sonra
          # "requires a provisioning profile" olarak cikiyor ve sebebi gorunmuyor. Her varsayimi
          # burada, olustugu yerde dogruluyoruz.
          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "CERTIFICATE_PRIVATE_KEY bos. Codemagic > Environment variables icinde 'signing'"
            echo "grubunun BU workflow'a bagli oldugunu ve degiskenin secure olarak tanimli"
            echo "oldugunu dogrulayin."
            exit 1
          fi
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
            --create
          keychain add-certificates
          cd ios
          xcode-project use-profiles \
            --project "StreamLiveX.xcodeproj" \
            --archive-method app-store \
            --code-signing-setup-verbose-logging
          # use-profiles hicbir profil eslestiremezse de 0 doner. Manuel imzada profil sart
          # oldugu icin, arsivlemeye gecmeden once projeye gercekten yazildigini dogruluyoruz.
          if ! xcodebuild -workspace "StreamLiveX.xcworkspace" -scheme "$XCODE_SCHEME" \
                 -showBuildSettings 2>/dev/null | grep -q "PROVISIONING_PROFILE_SPECIFIER = ."; then
            echo "Profil projeye uygulanmadi: PROVISIONING_PROFILE_SPECIFIER bos kaldi."
            echo "Yukaridaki fetch-signing-files ciktisinda kac profil bulundugunu kontrol edin."
            exit 1
          fi
      - name: Build numarasini ayarla (Codemagic otomatik artirir)
        script: |
          cd ios
          agvtool new-version -all "$BUILD_NUMBER"
      - name: IPA derle
        script: |
          cd ios
          xcode-project build-ipa \
            --workspace "StreamLiveX.xcworkspace" \
            --scheme "$XCODE_SCHEME" \
            --verbose \
            --disable-xcpretty
    artifacts:
      - ios/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true   # derleme biter bitmez TestFlight'a yukle
