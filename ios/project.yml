name: StreamLiveX
options:
  bundleIdPrefix: com.streamlivex
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
targets:
  StreamLiveX:
    type: application
    platform: iOS
    sources:
      - path: StreamLiveX
        excludes:
          - Resources/Web
      - path: StreamLiveX/Resources/Web
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.streamlivex.ios
        INFOPLIST_FILE: StreamLiveX/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: "34JL83RV94"
        CODE_SIGN_IDENTITY: "Apple Distribution"
    scheme:
      testTargets: []
