<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1920, initial-scale=1" />
  <title>StreamLiveX</title>
  <style>
    :root { --bg:#0b0f1a; --fg:#eef2ff; --accent:#6ea8ff; --muted:#8b93a7; }
    html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
      font-family: system-ui, "Segoe UI", Roboto, sans-serif; overflow:hidden; }
    .wrap { height:100%; display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:24px; text-align:center; }
    h1 { font-size:64px; margin:0; letter-spacing:1px; }
    .accent { color:var(--accent); }
    p { font-size:28px; color:var(--muted); margin:0; max-width:1100px; line-height:1.5; }
    .badge { font-size:22px; color:var(--muted); border:1px solid #26304a;
      padding:10px 20px; border-radius:999px; }
    .spinner { width:52px; height:52px; border:5px solid #26304a;
      border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <!--
    PLACEHOLDER: webOS .ipk pipeline'ını uçtan uca doğrulamak için önyükleme ekranı.
    Sonraki adım: bu dosya, streamlivex.com backend'ine yönelen gerçek SPA build ile
    değiştirilecek (API tabanı https://streamlivex.com, yayınlar ham URL ile oynatılır).
  -->
  <div class="wrap">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Stream<span class="accent">LiveX</span></h1>
    <p>webOS paketi başarıyla yüklendi. Uygulama arayüzü bir sonraki derlemede bu pakete gömülecek.</p>
    <div class="badge" id="target">Backend: https://streamlivex.com</div>
  </div>
  <script>
    // TV uzaktan kumandasında Geri/Çıkış tuşunun uygulamayı kapatması için temel köprü.
    document.addEventListener('keydown', function (e) {
      // webOS Back tuşu = 461. Placeholder aşamada sadece logla.
      if (e.keyCode === 461) { /* geri tuşu: gerçek app'te geçmişe/çıkışa bağlanacak */ }
    });
  </script>
</body>
</html>
